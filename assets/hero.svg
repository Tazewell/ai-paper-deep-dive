<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-label="AI Paper Deep Dive: From reading papers to doing research">
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#070D20"/><stop offset="55%" stop-color="#101B39"/><stop offset="100%" stop-color="#0B0F24"/></linearGradient>
  <radialGradient id="halo"><stop offset="0%" stop-color="#6265FF" stop-opacity=".50"/><stop offset="50%" stop-color="#268CE6" stop-opacity=".16"/><stop offset="100%" stop-color="#0C1834" stop-opacity="0"/></radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2=".3"><stop offset="0%" stop-color="#98ACFF"/><stop offset="55%" stop-color="#6AD5FF"/><stop offset="100%" stop-color="#5FF4CC"/></linearGradient>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#23395D" stop-opacity=".96"/><stop offset="100%" stop-color="#0B1735" stop-opacity=".98"/></linearGradient>
  <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E7F3FF" stop-opacity=".93"/><stop offset="100%" stop-color="#95B7E7" stop-opacity=".79"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#020816" flood-opacity=".62"/></filter>
  <pattern id="dots" width="35" height="35" patternUnits="userSpaceOnUse"><circle cx="1.3" cy="1.3" r="1.1" fill="#C0D3FF" opacity=".12"/></pattern>
</defs>
